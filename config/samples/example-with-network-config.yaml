# OGX is internal-only (Praxis-fronted). The operator ALWAYS restricts ingress on port 8321
# to Praxis pods (label app: payload-processing) plus the operator namespace. The rules below
# are ADDITIVE: they are appended on top of that mandatory lock-down and cannot remove it.
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ogxserver-network-example
spec:
  distribution:
    name: starter
  workload:
    overrides:
      env:
        - name: OLLAMA_INFERENCE_MODEL
          value: 'llama3.2:1b'
        - name: OLLAMA_URL
          value: 'http://ollama-server-service.ollama-dist.svc.cluster.local:11434'
  network:
    policy:
      # These rules are added on top of the mandatory Praxis + operator ingress rules.
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: nsA
            - namespaceSelector:
                matchExpressions:
                  - key: team/authorized
                    operator: Exists
          ports:
            - protocol: TCP
              port: 8321
---
# NOTE: externalAccess.enabled is NOT honored — OGX is internal-only. Setting it to true
# produces an admission warning and no external exposure (Ingress) is created. This example
# is kept only to document that behavior.
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ogxserver-external-access-ignored
spec:
  distribution:
    name: starter
  workload:
    overrides:
      env:
        - name: OLLAMA_INFERENCE_MODEL
          value: 'llama3.2:1b'
        - name: OLLAMA_URL
          value: 'http://ollama-server-service.ollama-dist.svc.cluster.local:11434'
  network:
    externalAccess:
      enabled: true # ignored: treated as false, no Ingress created
---
# Example with NetworkPolicy explicitly disabled (emergency escape hatch).
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ogxserver-no-networkpolicy
spec:
  distribution:
    name: starter
  workload:
    overrides:
      env:
        - name: OLLAMA_INFERENCE_MODEL
          value: 'llama3.2:1b'
        - name: OLLAMA_URL
          value: 'http://ollama-server-service.ollama-dist.svc.cluster.local:11434'
  network:
    policy:
      enabled: false
